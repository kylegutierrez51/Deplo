<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Pipelines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/general.css">
  <link rel="stylesheet" href="../styles/sidebar.css">
  <link rel="stylesheet" href="../styles/table.css">
  <link rel="stylesheet" href="../styles/subheader.css">
  <link rel="stylesheet" href="../styles/filters.css">
  <link rel="stylesheet" href="../styles/pipeline-editor.css">
</head>

<body>

  <aside class="sidebar">

    <nav class="sidebar-nav" aria-label="Main">
      <div class="sidebar-content">
        <div class="sidebar-content-flex">
          <span class="subtitle">DEPLOY</span>
          <ul>
            <li>
              <ion-icon name="git-network-outline"></ion-icon>
              <a href="pipeline-list.html">
                <span class="title">Pipelines</span>
              </a>
            </li>
            <li>
              <ion-icon name="time-outline"></ion-icon>
              <a href="run-history.html">
                <span class="title">Run History</span>
              </a>
            </li>
            <li>
              <ion-icon name="checkmark-circle-outline"></ion-icon>
              <a href="approvals.html">
                <span class="title">Approvals</span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-content-flex">
          <span class="subtitle">MANAGE</span>
          <ul>
            <li>
              <ion-icon name="key-outline"></ion-icon>
              <a href="secrets.html">
                <span class="title">Secrets</span>
              </a>
            </li>
            <li>
              <ion-icon name="settings-outline"></ion-icon>
              <a href="environments.html">
                <span class="title">Environments</span>
              </a>
            </li>
            <li>
              <ion-icon name="flash-outline"></ion-icon>
              <a href="webhooks.html">
                <span class="title">Webhooks</span>
              </a>
            </li>
            <li>
              <ion-icon name="reader-outline"></ion-icon>
              <a href="audit-log.html">
                <span class="title">Audit Log</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="profile">
      <div class="profile-flex">
        <div class="profile-container">
          <div class="profile-pic"></div>
          <div class="profile-details">
            <div class="name">Coco</div>
            <div class="role">ADMIN</div>
          </div>
        </div>
        <div>
          <ion-icon name="chevron-up-outline"></ion-icon>
        </div>
      </div>
    </div>

  </aside>

  <div class="profile-options">
    <div class="profile-view-flex">
      <div class="profile-view">Profile</div>
      <div class="sign-out">Sign Out</div>
    </div>
  </div>



  <header>
    <div class="header-flex">

      <div class="left-side">
        <button class="sidebar-toggle" id="sidebarToggle">
          <ion-icon name="menu-outline"></ion-icon>
        </button>
        <div class="divider"></div>
        <div class="pipeline-title">
          <a href="pipeline-list.html">Pipelines</a>
          <div>|</div>
          <div>deploy-api</div>
        </div>
        <div class="select-group">
          <select id="environment" name="environment">
            <option value="production">Production</option>
            <option value="staging">Staging</option>
            <option value="development">Development</option>
            <option value="preview">Preview</option>
          </select>
        </div>
        <div class="nodes-edges">
          <div>7 stages</div>
          <div>&bull;</div>
          <div>6 connections</div>
        </div>
      </div>

      <div class="right-side">
        <button class='add-stage-btn'>
          <ion-icon name="add-outline"></ion-icon>
          <div>Add Stage</div>
        </button>
        <div class="divider"></div>
        <div class="sidebar-icon">
          <ion-icon name="journal-outline"></ion-icon>
        </div>
        <div class="divider"></div>
        <button class='save-btn'>
          <ion-icon name="save-outline"></ion-icon>
          <div>Save Draft</div>
        </button>
        <button class='run-btn'>
          <ion-icon name="caret-forward-outline"></ion-icon>
          <div>Run Pipeline</div>
        </button>
      </div>

    </div>
  </header>

  <main class="page-content">
    <div>Pipeline Editor</div>
  </main>

  <aside class="stage-sidebar">
    <div class="stage-sidebar-header">
      <div class="stage-title">
        <div class="icon-border">
          <ion-icon name="rocket-outline"></ion-icon>
        </div>
        <div class="title">Configure Stage</div>
      </div>
      <button class="exit-btn">x</button>
    </div>

    <form id="post-form" method="POST">
      <div class="stage-sidebar-nav">

        <div class="stage-name">
          <label for="stage-name">STAGE NAME</label>
          <input id="stage-name" name="stage-name" placeholder="e.g. build">
        </div>

        <div class="stage-types">
          <label>STAGE TYPE</label>
          <div class="stage-type-grid">
            <div class="item">
              <ion-icon name="hammer-outline"></ion-icon>
              <div>Build</div>
            </div>
            <div class="item">
              <ion-icon name="pencil-outline"></ion-icon>
              <div>Test</div>
            </div>
            <div class="item">
              <ion-icon name="rocket-outline"></ion-icon>
              <div>Deploy</div>
            </div>
            <div class="item">
              <ion-icon name="shield-checkmark-outline"></ion-icon>
              <div>Approval</div>
            </div>
            <div class="item">
              <ion-icon name="code-outline"></ion-icon>
              <div>Script</div>
            </div>
          </div>
        </div>

        <div class="command">
          <label for="command">COMMAND</label>
          <textarea id="command" name="command" placeholder="e.g. npm run build"></textarea>
        </div>

        <div class="timeout-and-retries">
          <div class="timeout">
            <div>
              <ion-icon name="time-outline"></ion-icon>
              <label for="timeout">TIMEOUT (S)</label>
            </div>
            <input id="timeout" name="timeout" placeholder="e.g. npm run build" value="0">
          </div>
          <div class="retries">
            <div>
              <ion-icon name="refresh-outline"></ion-icon>
              <label for="retries">RETRIES</label>
            </div>
            <input id="retries" name="retries" placeholder="e.g. npm run build" value="0">
          </div>
        </div>

        <div class="env-vars">
          <div class="env-title-container">
            <div class="env-title">
              <ion-icon name="settings-outline"></ion-icon>
              <label>ENV VARIABLES</label>
            </div>
            <button class='add-env-btn'>
              <ion-icon name="add-outline"></ion-icon>
              Add
            </button>
          </div>
          <div class="env-vars-flex">
            <div class="env-container">
              <input name="env-key" placeholder="KEY">
              <span>=</span>
              <input name="env-value" placeholder="VALUE">
            </div>
            <div class="env-container">
              <input name="env-key" placeholder="KEY">
              <span>=</span>
              <input name="env-value" placeholder="VALUE">
            </div>
          </div>
        </div>

        <div class="secrets">
          <div class="secrets-info">
            <div>
              <ion-icon name="lock-closed-outline"></ion-icon>
              <label>SECRETS</label>
            </div>
            <div class="info">Injected at runtime. Never logged.</div>
          </div>
        </div>
        <div class="secrets-flex">
          <label class="secret-container">
            <div class="secret">
              <input type="checkbox">
              <span class="secret-key">DATABASE_URL</span>
            </div>
            <span class="secret-env">production</span>
          </label>
          <label class="secret-container">
            <div class="secret">
              <input type="checkbox">
              <span class="secret-key">DATABASE_URL</span>
            </div>
            <span class="secret-env">production</span>
          </label>
          <label class="secret-container">
            <div class="secret">
              <input type="checkbox">
              <span class="secret-key">DATABASE_URL</span>
            </div>
            <span class="secret-env">production</span>
          </label>
        </div>
    </form>
  </aside>

</body>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script type="module" src="../utils/toggleSidebar.js"></script>
<script type="module" src="../utils/sidebar-profile.js"></script>

</html>
