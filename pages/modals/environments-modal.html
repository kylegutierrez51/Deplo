<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/general.module.css">
  <link rel="stylesheet" href="../../styles/modals/modal.module.css">
  <link rel="stylesheet" href="../../styles/modals/environment-modal.module.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>New Environment</h3>
        <button class="close-btn" id="close-btn"><ion-icon name="close-outline"></ion-icon></button>
      </div>

      <form class="modal-form" method="POST">
        <div class="form-items">
          <div class="item">
            <label>Name</label>
            <input name="secret_key" placeholder="e.g. staging, qa-integration">
            <span>Lowercase letters, numbers, and hyphens only. This is the key used to scope secrets and pipeline targets.</span>
          </div>

          <div class="item">
            <label>Type</label>
            <div class="button-group">
              <button class="prod-btn">Production</button>
              <button class="staging-btn">Staging</button>
              <button class="dev-btn">Development</button>
              <button class="prev-btn">Preview</button>
              <button class="custom-btn">Custom</button>
            </div>
          </div>

          <div class="approval-toggle-box">
            <input type="checkbox" id="require-approval" name="require_approval">
            <label for="require-approval" class="toggle-option">
              <span class="toggle-switch"></span>
              <div class="toggle-content">
                <div class="toggle-title">
                  <ion-icon name="lock-closed-outline"></ion-icon>
                  Require approval for deploys
                </div>
                <p class="toggle-description">Pipeline runs targeting this environment will pause at a manual approval gate before executing deploy stages.</p>
              </div>
            </label>
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button id="cancel-btn" class="cancel-btn" type="button">Cancel</button>
        <button id="create-btn" class="create-btn" type="submit">Create</button>
      </div>
    </div>
  </div>

</body>
</html>
