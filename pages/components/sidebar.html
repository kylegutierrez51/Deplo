<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script>
  /* 
  This script allows the .profile-view-container to lay over other parts of the sidebar (.sidebar-content) when DevTools is up 

  JS-computed position: On click, getBoundingClientRect() measures exactly where the profile card sits in the viewport and sets the .profile-view-container's (popup) bottom/left/width accordingly to position it properly. It'll always align correctly even when DevTools changes the viewport height.
  */
  const profile = document.querySelector('.profile');
  const popup = document.querySelector('.profile-view-container');

  profile.addEventListener('click', function () {
    const rect = profile.getBoundingClientRect();
    popup.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
    popup.style.left = rect.left + 'px';
    popup.style.width = rect.width + 'px';
    popup.classList.toggle('visible');
  });
</script>
