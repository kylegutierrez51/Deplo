<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Run Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/general.css">
  <link rel="stylesheet" href="../../styles/sidebar.css">
  <link rel="stylesheet" href="../../styles/table.css">
  <link rel="stylesheet" href="../../styles/subheader.css">
  <link rel="stylesheet" href="../../styles/filters.css">
  <link rel="stylesheet" href="../../styles/webhooks.css">
  <link rel="stylesheet" href="../../styles/run-detail.css">
</head>
<body>

  <main>
    <div class="page-layout">

      <div class="run-detail-card">
        <div class="rdc-inner">

          <div class="rdc-info">
            <!-- Row 1: name, run number, status, environment -->
            <div class="rdc-title-row">
              <span class="rdc-name">deploy-api</span>
              <span class="rdc-num">#47</span>
              <div class="rdc-status running">
                <ion-icon name="sync-outline"></ion-icon>
                Running
              </div>
              <div class="rdc-env production">production</div>
            </div>

            <!-- Row 2: commit info -->
            <div class="rdc-commit-row">
              <div class="rdc-commit-ref">
                <ion-icon name="git-commit-outline"></ion-icon>
                <span class="rdc-commit-hash">a1b2c3d</span>
              </div>
              <span class="rdc-commit-msg">fix: resolve connection pool exhaustion under load</span>
              <div class="rdc-meta-item">
                <ion-icon name="git-branch-outline"></ion-icon>
                <span>main</span>
              </div>
              <div class="rdc-meta-item rdc-link">
                <ion-icon name="open-outline"></ion-icon>
                <span>acme/api-server</span>
              </div>
            </div>

            <!-- Row 3: trigger info -->
            <div class="rdc-trigger-row">
              <div class="rdc-meta-item">
                <ion-icon name="flash-outline"></ion-icon>
                <span>Triggered by webhook <span class="rdc-user">(sarah.chen)</span></span>
              </div>
              <div class="rdc-meta-item">
                <ion-icon name="stopwatch-outline"></ion-icon>
                <span>7m 12s</span>
              </div>
              <div class="rdc-meta-item">
                <ion-icon name="time-outline"></ion-icon>
                <span>7m ago</span>
              </div>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="rdc-actions">
            <button class="rdc-btn-cancel">
              <ion-icon name="ban-outline"></ion-icon>
              Cancel Run
            </button>
            <button class="rdc-btn-rerun">
              <ion-icon name="refresh-outline"></ion-icon>
              Re-run
            </button>
          </div>

        </div>
      </div>

    </div>
  </main>

</body>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script type="module" src="../utils/toggleSidebar.js"></script>
<script type="module" src="../utils/sidebar-profile.js"></script>
</html>
