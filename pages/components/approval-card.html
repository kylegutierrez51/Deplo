<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Webhook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/general.css">
  <link rel="stylesheet" href="../../styles/sidebar.css">
  <link rel="stylesheet" href="../../styles/table.css">
  <link rel="stylesheet" href="../../styles/subheader.css">
  <link rel="stylesheet" href="../../styles/filters.css">
  <link rel="stylesheet" href="../../styles/webhooks.css">
  <link rel="stylesheet" href="../../styles/approvals.css">
</head>
<body>


  <main>
    <div class="page-flex">
      <div class="btm"></div>

      <section class="approval-card">
        <div class="approvals-flex">
          <div class="approvals-detail">
            <div class="pipeline-name-type">
              <span>release-mobile</span>
              <div class="production">Production</div>
              <div class="type manual">Manual</div>
            </div>
            <div class="feature-info">
              <div class="feature-id">
                <ion-icon name="git-commit-outline"></ion-icon>
                <span>c3d4e5f</span>
              </div>
              <span>fix: resolve deep link crash on Android 14</span>
            </div>
            <div class="extra-info">
              <div class="info-flex">
                <ion-icon name="person-outline"></ion-icon>
                <span>alex.kim</span>
              </div>
              <div class="info-flex">
                <ion-icon name="git-branch-outline"></ion-icon>
                <span>main</span>
              </div>
              <div class="info-flex">
                <ion-icon name="stopwatch-outline"></ion-icon>
                <span>Waiting <span class="waiting-time">18h 17m</span></span>
              </div>
              <div class="info-flex">
                <ion-icon name="caret-forward-outline"></ion-icon>
                <span>6/8 stages complete</span>
              </div>
            </div>
            <div class="stage-view">
              <div>
                <ion-icon name="chevron-down-outline"></ion-icon>
                <span>Hide stages</span>
              </div>

            </div>
          </div>
          <div class="btn-group">
            <div class="btn">
              <button class='reject-btn'>
                <ion-icon name="close-circle-outline"></ion-icon>
                Reject
              </button>
            </div>
            <div class="btn">
              <button class='approve-btn'>
                <ion-icon name="checkmark-circle-outline"></ion-icon>
                Approve
              </button>
            </div>
          </div>
        </div>
        <div class="stages">
          <div class="stages-flex">
            <div class="stage">
              <ion-icon name="cube-outline"></ion-icon>
              <span>install-deps</span>
              <ion-icon name="checkmark-circle-outline"></ion-icon>
            </div>
            <div>→</div>
            <div class="stage">
              <ion-icon name="cube-outline"></ion-icon>
              <span>lint</span>
              <ion-icon name="checkmark-circle-outline"></ion-icon>
            </div>
            <div>→</div>
            <div class="stage">
              <ion-icon name="flask-outline"></ion-icon>
              <span>unit-tests</span>
              <ion-icon name="checkmark-circle-outline"></ion-icon>
            </div>
            <div>→</div>
            <div class="stage approval">
              <ion-icon name="shield-outline"></ion-icon>
              <span>release-approval</span>
              <ion-icon name="alert-circle-outline"></ion-icon>
            </div>
            <div>→</div>
            <div class="stage">
              <ion-icon name="rocket-outline"></ion-icon>
              <span>publish-stores</span>
              <ion-icon name="time-outline"></ion-icon>
            </div>
          </div>
        </div>
      </section>



      <section class="page-view">
        <div class="pages">
          Showing 1-5 of 20
        </div>

        <div class="pagination-container">
          <div class="pagination-flex">
            <div class="view-option">
              <ion-icon name="chevron-back-outline"></ion-icon>
              <div>Prev</div>
            </div>

            <div class="page-numbers">
              <div class="page-number">1</div>
              <div class="page-number">...</div>
              <div class="page-number">8</div>
              <div class="page-number"><span>9</span></div>
              <div class="page-number">10</div>
              <div class="page-number">...</div>
              <div class="page-number">22</div>
            </div>

            <div class="view-option">
              <div>Next</div>
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </div>

          </div>
        </div>
      </section>
    </div>


  </main>

</body>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script type="module" src="../utils/toggleSidebar.js"></script>
<script type="module" src="../utils/sidebar-profile.js"></script>
</html>
