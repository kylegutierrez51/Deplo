<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/general.module.css">
  <link rel="stylesheet" href="../../styles/modals/modal.module.css">
  <link rel="stylesheet" href="../../styles/modals/pipelines-modal.module.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <div class="modal-overlay">
    <div class="modal-container">

      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-title-group">
            <h3>Add Pipeline</h3>
          </div>
        </div>
        <button class="close-btn" type="button" id="close-btn">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <form class="modal-form" method="POST">
        <div class="form-items">
          <div class="item">
            <label>Name</label>
            <input name="name" placeholder="e.g. build-frontend">
          </div>

          <div class="item">
            <label>Repo URL</label>
            <input name="repo_url" placeholder="e.g. https://github.com/abcd/web-client">
          </div>

          <div class="item">
            <label>Description <span class="optional-badge">optional</span></label>
            <textarea name="description" placeholder="e.g. Builds and deploys the web client on every push to main"></textarea>
          </div>

          <div class="item">
            <label>
              Branch Filters
              <span class="optional-badge">optional</span>
            </label>
            <input type="text" id="branch-filter-input" placeholder="e.g. main, release/* — press Enter to add">
            <p class="field-hint">
              <ion-icon name="information-circle-outline"></ion-icon>
              Glob pattern. Leave empty to trigger on all branches.
            </p>
            <div class="branch-pills" id="branch-pills"></div>
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button id="cancel-btn" class="cancel-btn" type="button">Cancel</button>
        <button id="create-btn" class="create-btn" type="submit">Create</button>
      </div>
    </div>
  </div>

  <script>
    const branchInput = document.getElementById('branch-filter-input');
    const branchPills = document.getElementById('branch-pills');

    branchInput.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();

      const value = branchInput.value.trim();
      if (!value) return;

      const pill = document.createElement('span');
      pill.className = 'branch-pill';
      pill.textContent = value;
      branchPills.appendChild(pill);

      branchInput.value = '';
    });
  </script>

</body>
</html>
