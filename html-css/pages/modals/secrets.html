<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deplo | Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/general.module.css">
  <link rel="stylesheet" href="../../styles/modals/modal.module.css">
  <link rel="stylesheet" href="../../styles/modals/secret-modal.module.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <div class="modal-overlay">
    <div class="modal-container">

      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-title-group">
            <h3>Secret</h3>
          </div>
        </div>
        <button class="close-btn" type="button" id="close-btn">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <form class="modal-form" method="POST">
        <div class="form-items">
          <div class="item">
            <label>Key</label>
            <span>DATABASE_URL</span>
          </div>

          <div class="item">
            <label>Value</label>
            <div class="value-input-wrapper">
              <div class="secret-wrapper">
                <span>••••••••••••••••••••••••</span>
                <ion-icon name="eye-outline"></ion-icon>
              </div>

            </div>
          </div>

          <div class="item">
            <label>Environment Type</label>
            <div class="button-group">
              <div class="pill pill--production">Production</div>
            </div>
          </div>

          <div class="item">
            <label>Notes <span>(optional)</span></label>
            <span>Rotated quarterly, scoped to read-only</span>
          </div>

          <div class="item">
            <label>Created By</label>
            <span>coco</span>
          </div>

        </div>
      </form>
      <div class="modal-footer">
        <button id="delete-btn" class="delete-btn" type="button">Delete</button>
        <button id="edit-btn" class="edit-btn" type="submit">Edit</button>
      </div>
    </div>
  </div>

</body>
</html>
